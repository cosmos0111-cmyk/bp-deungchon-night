<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>등촌동 유흥 정보 - 상세 분석 | 등촌동 나이트라이프</title>
    <meta name="description" content="등촌동 유흥 정보를 종합적으로 제공합니다. 검증된 업소 리스트, 실제 이용자 리뷰, 지역별 상세 데이터를 바탕으로 한 등촌동 나이트라이프 프리미엄 가이드. 2025년 최신 정보.">
    <meta name="keywords" content="등촌동 유흥 정보, 등촌동 나이트라이프, 등촌동 업소 분석, 등촌동 주점 데이터, 등촌동 유흥업소 통계, 등촌동 night">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://deungchon-night.pages.dev/info">
    <meta name="bpaas-design-system" content="editorial-apple">
    <meta name="bpaas-design-theme" content="kr-noir-gold">
    <!-- Open Graph -->
    <meta property="og:title" content="등촌동 유흥 정보 - 상세 분석 | 프리미엄 나이트라이프 가이드">
    <meta property="og:description" content="등촌동 유흥 정보의 정확한 데이터와 인사이트. 업소별 리뷰 분석, 지역 트렌드, 2025년 이용자 행동 패턴을 심층 조명합니다.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://deungchon-night.pages.dev/info">
    <meta property="og:locale" content="ko_KR">
    <style>
        /* Editorial Apple 디자인 시스템 - kr-noir-gold 테마 */
        :root {
            --primary-gold: #C9A84C;
            --secondary-gold: #E8D48B;
            --dark-bg: #0D0D0D;
            --dark-surface: #1A1A1A;
            --dark-card: #222222;
            --text-primary: #F5F5F5;
            --text-secondary: #A0A0A0;
            --text-gold: #D4AF37;
            --border-subtle: #2C2C2C;
            --font-heading: 'Playfair Display', 'Times New Roman', serif;
            --font-body: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            --spacing-unit: 1.25rem;
            --max-width: 1280px;
            --nav-height: 72px;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--text-gold); text-decoration: none; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.8; }
        img { max-width: 100%; height: auto; display: block; }

        /* 헤더 & 네비게이션 */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(13, 13, 13, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            height: var(--nav-height);
            display: flex;
            align-items: center;
        }
        .header__inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-unit);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header__logo {
            font-family: var(--font-heading);
            font-size: 1.625rem;
            letter-spacing: -0.01em;
            color: var(--text-gold);
            font-weight: 700;
        }
        .header__logo span { color: var(--text-primary); font-weight: 400; }

        .nav__list {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        .nav__link {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            position: relative;
            padding-bottom: 4px;
            text-transform: uppercase;
        }
        .nav__link:hover,
        .nav__link--active {
            color: var(--text-gold);
        }
        .nav__link--active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary-gold);
        }

        /* 햄버거 메뉴 (모바일) */
        .hamburger-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            background: transparent;
            border: none;
        }
        .hamburger-menu span {
            display: block;
            width: 28px;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s var(--ease-out-expo);
        }
        .hamburger-menu.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger-menu.active span:nth-child(2) { opacity: 0; }
        .hamburger-menu.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        /* 히어로 섹션 */
        .hero {
            padding: calc(var(--nav-height) + 4rem) 0 3rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(201, 168, 76, 0.04) 0%, transparent 60%);
        }
        .hero__content {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 var(--spacing-unit);
        }
        .hero__label {
            font-size: 0.8125rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-gold);
            margin-bottom: 1.25rem;
            font-weight: 500;
        }
        .hero__title {
            font-family: var(--font-heading);
            font-size: 3.25rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .hero__title .gold { color: var(--primary-gold); }
        .hero__subtitle {
            font-size: 1.1875rem;
            color: var(--text-secondary);
            max-width: 720px;
            margin: 0 auto 2rem;
            font-weight: 400;
        }
        .hero__meta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .hero__meta span { background: var(--dark-card); padding: 0.375rem 1rem; border-radius: 100px; border: 1px solid var(--border-subtle); }

        /* 공통 섹션 */
        .section {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 4rem var(--spacing-unit);
        }
        .section__title {
            font-family: var(--font-heading);
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .section__subtitle {
            font-size: 1.0625rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 720px;
        }
        .gold-line {
            width: 60px;
            height: 3px;
            background: var(--primary-gold);
            margin: 1rem 0 2rem;
        }
        .text-block {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 800px;
        }
        .text-block p { margin-bottom: 1.25rem; }

        /* 카드 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.75rem;
            margin-top: 2rem;
        }
        .card {
            background: var(--dark-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.4s var(--ease-out-expo);
        }
        .card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .card__icon { font-size: 2rem; margin-bottom: 1rem; }
        .card__title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-primary); }
        .card__text { font-size: 0.9375rem; color: var(--text-secondary); line-height: 1.6; }
        .card__stat { font-size: 1.75rem; font-weight: 700; color: var(--text-gold); margin: 0.5rem 0; }

        /* 데이터 테이블 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.9375rem;
        }
        .data-table th {
            text-align: left;
            padding: 1rem 1.25rem;
            background: var(--dark-surface);
            color: var(--text-gold);
            font-weight: 600;
            border-bottom: 2px solid var(--primary-gold);
        }
        .data-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .data-table tr:hover td { background: rgba(201,168,76,0.04); }

        /* FAQ */
        .faq-list {
            max-width: 800px;
            margin-top: 1.5rem;
        }
        .faq-item {
            border-bottom: 1px solid var(--border-subtle);
            padding: 1.25rem 0;
        }
        .faq-item__question {
            font-weight: 600;
            font-size: 1.125rem;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .faq-item__question::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--text-gold);
            transition: transform 0.3s ease;
        }
        .faq-item__question.active::after { transform: rotate(45deg); }
        .faq-item__answer {
            margin-top: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* 인용구 */
        .insight-block {
            background: var(--dark-surface);
            border-left: 4px solid var(--primary-gold);
            padding: 2rem 2.5rem;
            margin: 2rem 0;
            border-radius: 4px;
        }
        .insight-block p { font-style: italic; font-size: 1.125rem; color: var(--text-primary); }
        .insight-block cite { display: block; margin-top: 1rem; color: var(--text-gold); font-style: normal; font-size: 0.875rem; }

        /* 푸터 */
        .footer {
            border-top: 1px solid var(--border-subtle);
            padding: 3rem var(--spacing-unit);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            background: var(--dark-bg);
        }
        .footer__inner {
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .footer__links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .footer__links a { color: var(--text-secondary); }
        .footer__links a:hover { color: var(--text-gold); }

        /* 반응형 */
        @media (max-width: 1024px) {
            .nav__list { gap: 1.5rem; }
            .hero__title { font-size: 2.75rem; }
        }
        @media (max-width: 768px) {
            .hamburger-menu { display: flex; }
            .nav__list {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                width: 100%;
                background: rgba(13,13,13,0.98);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                border-bottom: 1px solid var(--border-subtle);
            }
            .nav__list.open { display: flex; }
            .nav__link { font-size: 1rem; }
            .hero__title { font-size: 2rem; }
            .section { padding: 2.5rem var(--spacing-unit); }
            .
</body>
</html>
